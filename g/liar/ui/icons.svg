    <path d="M5.6 10.4a.9.9 0 0 1 1.8 0 4.6 4.6 0 0 0 6.7 4.1l1.35 1.35a6.4 6.4 0 0 1-2.45.85v2.5h2.6a.9.9 0 0 1 0 1.8H8.5a.9.9 0 0 1 0-1.8h2.6v-2.5a6.4 6.4 0 0 1-5.5-6.3z" opacity=".55"/>
